<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Healable v3</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="healable-ds.css" />
<style>
html,body{margin:0;padding:0;height:100%;background:#FAF9F6;overflow:hidden}
*{-webkit-font-smoothing:antialiased}
.hbl{--blue:#4665D8;--blue-deep:#3A55C2;--blue-12:rgba(70,101,216,0.12);--blue-08:rgba(70,101,216,0.07)}
.hbl-v3drop{background:var(--paper-3);border:1.5px dashed var(--line);border-radius:16px;transition:background .16s,border-color .16s,box-shadow .16s}
.hbl-v3drop:hover{background:var(--paper);border-color:var(--blue);box-shadow:var(--e2)}
.hbl-v3row{transition:background .13s ease}.hbl-v3row:hover{background:var(--paper-2)}
.hbl-v3act{display:grid;place-items:center;width:26px;height:26px;border-radius:8px;border:1px solid transparent;background:transparent;color:var(--ink-30);cursor:pointer;opacity:0;transition:opacity .13s ease,background .13s ease,color .13s ease}
.hbl-v3row:hover .hbl-v3act{opacity:1}.hbl-v3act:hover{background:var(--paper);border-color:var(--line-2);color:var(--ink-80)}
.hbl-v3act--alert:hover{color:#A5321F;border-color:rgba(192,64,44,0.3);background:var(--alert-12)}
@keyframes hblFlip{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}
.hbl-v3seg button{padding:5px 10px;font-size:11.5px}.hbl-v3seg button svg{width:14px;height:14px}
a{color:var(--blue);text-decoration:none}a:hover{color:var(--blue-deep);text-decoration:underline}
#boot-err{display:none;position:fixed;inset:0;place-items:center;font:14px/1.5 Manrope,sans-serif;color:#45403A;padding:2rem;text-align:center}
</style>
</head>
<body>
<div id="root"></div>
<div id="boot-err">Healable v3 lastet ikke. Sjekk at filene under healable/ er med.</div>
<script>
  window.__resources = window.__resources || { mark: 'assets/healable-mark.png' };
</script>
<script src="vendor/react.development.js"></script>
<script src="vendor/react-dom.development.js"></script>
<script src="vendor/babel.min.js"></script>
<script type="text/babel" src="parts.jsx"></script>
<script type="text/babel" src="screens/LabReport.jsx"></script>
<script type="text/babel" src="v3/v3-data.jsx"></script>
<script type="text/babel" src="v3/v3-extract.jsx"></script>
<script type="text/babel" src="v3/v3-chat.jsx"></script>
<script type="text/babel" src="v3/v3-rail.jsx"></script>
<script type="text/babel" src="v3/v3-preview.jsx"></script>
<script type="text/babel" src="v3/v3-lock.jsx"></script>
<script type="text/babel" src="v3/v3-studio.jsx"></script>
<script type="text/babel" src="v3/v3-app.jsx"></script>
<script type="text/babel">
function Stage() {
  return (
    <div style={{ position: 'fixed', inset: 0 }}>
      <window.V3App entry="Slippsoner først" lockVar="Modal" skillVar="Komponist-knapp" />
    </div>
  );
}
function boot(n) {
  if (window.V3App && window.ReactDOM) {
    window.ReactDOM.createRoot(document.getElementById('root')).render(<Stage />);
    return;
  }
  if ((n || 0) > 80) {
    var el = document.getElementById('boot-err');
    if (el) el.style.display = 'grid';
    return;
  }
  setTimeout(function () { boot((n || 0) + 1); }, 50);
}
boot(0);
</script>
</body>
</html>
